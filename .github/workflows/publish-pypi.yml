name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            python: "3.13"

          - name: linux
            # Ubuntu 22.04 uses glibc 2.35, so its wheel also installs on
            # Ubuntu 22.04 and other distributions with glibc >= 2.35.
            os: ubuntu-22.04
            python: "3.13"
            build_sdist: true

          - name: macos-arm64
            os: macos-latest
            python: "3.13"

          # macos-latest is Apple Silicon. Build separately for Intel Macs.
          - name: macos-x86_64
            os: macos-13
            python: "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # Jammy's stock PipeWire (0.3.48) is older than the headers needed
          # by pipewire-rs 0.8. Use current headers while retaining Jammy's
          # glibc 2.35 as the wheel compatibility baseline.
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:pipewire-debian/pipewire-upstream
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev libdbus-1-dev

      - name: Install Python build tools
        run: python -m pip install --upgrade maturin twine

      - name: Build wheel
        run: maturin build --release --out dist

      - name: Build source distribution
        if: matrix.build_sdist
        run: maturin sdist --out dist

      - name: Validate package metadata
        run: twine check dist/*

      - name: Upload built wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ matrix.name }}
          path: dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-package-distributions-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
